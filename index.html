            refinedOverlay.addTo(map);
            isShowingRefined = true;
            btnReset.innerText = "↩️ 元に戻す";
        }
    }

    async function updateObservationDate(bounds, targetEndDate, timeRangeStart) {
        if (!bounds) return;
        document.getElementById('obsDateDisplay').innerText = `🛰️ SAR観測日時: 取得中...`;
        
        const toIsoSec = (d) => d.toISOString().replace(/\.\d{3}Z$/, 'Z');
        const startStr = toIsoSec(timeRangeStart);
        const endStr = toIsoSec(targetEndDate);
        const center = map.getCenter();
        const eps = 0.005;
        const centerBbox = [center.lng - eps, center.lat - eps, center.lng + eps, center.lat + eps];
        
        try {
            const res = await fetch('https://catalogue.dataspace.copernicus.eu/stac/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    bbox: centerBbox,
                    datetime: `${startStr}/${endStr}`,
                    collections: ["sentinel-1-grd"],
                    limit: 20,
                    sortby: [{ field: "datetime", direction: "desc" }]
                })
            });
            const data = await res.json();
            
            if (data.features && data.features.length > 0) {
                const latestFeat = data.features[0];
                const latestDt = new Date(latestFeat.properties.datetime);
                const latestMs = latestDt.getTime();
                const orbitRaw = latestFeat.properties["sat:orbit_state"] || "";
                const todLabel = getJstTimeOfDayLabel(latestDt);
                const orbitDir = orbitRaw === "ascending" ? "上昇" : (orbitRaw === "descending" ? "下降" : "");
                const orbitLabel = orbitDir ? ` [${orbitDir}/${todLabel}]` : ` [${todLabel}]`;
                const MS_DAY = 86400000;

                let pastDt = null;
                let bestCycleDays = 9999;
                for (let i = 1; i < data.features.length; i++) {
                    const dt = new Date(data.features[i].properties.datetime);
                    const diffDays = (latestMs - dt.getTime()) / MS_DAY;
                    if (diffDays < 5.5) continue;
                    const isSameOrbit = (Math.abs(diffDays - 12) <= 0.2) ||
                                        (Math.abs(diffDays - 24) <= 0.2) ||
                                        (Math.abs(diffDays - 36) <= 0.2) ||
                                        (Math.abs(diffDays - 48) <= 0.2);
                    if (isSameOrbit && diffDays < bestCycleDays) {
                        bestCycleDays = diffDays;
                        pastDt = dt;
                    }
                }
                if (!pastDt && data.features.length > 1) {
                    for (let i = 1; i < data.features.length; i++) {
                        const dt = new Date(data.features[i].properties.datetime);
                        if ((latestMs - dt.getTime()) / MS_DAY >= 5.5) {
                            pastDt = dt;
                            break;
                        }
                    }
                }

                const latestFmt = formatDateTimeJST(latestDt);
                const pairInfo = pastDt ? ` (比較: ${formatShortDateTimeJST(pastDt)})` : "";
                document.getElementById('obsDateDisplay').innerText = `🛰️ SAR観測: ${latestFmt}${orbitLabel}${pairInfo}`;
                fetchRainData(center.lat, center.lng, latestDt);
            } else {
                document.getElementById('obsDateDisplay').innerText = `🛰️ SAR観測日時: データなし`;
            }
        } catch (e) {
            console.error(e);
            document.getElementById('obsDateDisplay').innerText = `🛰️ SAR観測日時: 未取得(APIｴﾗｰ)`;
        }
    }

    async function fetchRainData(lat, lon, obsDate) {
        document.getElementById('rainDisplay').innerText = `🌧️ 直近3日間の雨量: 計算中...`;
        document.getElementById('rainDisplay').style.display = 'block';

        const endDateStr = formatDateJST(obsDate);
        const startDate = new Date(obsDate.getTime() - 3 * 24 * 60 * 60 * 1000);
        const startDateStr = formatDateJST(startDate);

        const apiUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${startDateStr}&end_date=${endDateStr}&hourly=precipitation&timezone=Asia%2FTokyo`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("気象データの取得に失敗しました");
            const weatherData = await response.json();
            const rainArray = weatherData.hourly.precipitation;
            let totalRain = 0;
            for (let i = 0; i < rainArray.length; i++) {
                if (rainArray[i] !== null) totalRain += rainArray[i];
            }
            document.getElementById('rainDisplay').innerText = `🌧️ 観測前3日間の雨量: ${totalRain.toFixed(1)} mm`;
        } catch (error) {
            console.error(error);
            document.getElementById('rainDisplay').innerText = `🌧️ 観測前3日間の雨量: 取得エラー`;
        }
    }

    // ==========================================
    // Gemini API 呼び出し共通基盤 (地名検索用: Hydrogen優先・思考LOW固定)
    // ==========================================
    const MODEL_CANDIDATES = ["gemini-4-hydrogen", "gemini-3.8-flash"];

    async function fetchWithTimeout(url, options, timeoutMs = 40000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try { return await fetch(url, { ...options, signal: controller.signal }); } 
        finally { clearTimeout(timer); }
    }

    async function callGeminiWithFallback(apiKey, basePayload) {
        const errors = [];
        for (const modelName of MODEL_CANDIDATES) {
            const supportsThinking = modelName.startsWith("gemini-4") || modelName.startsWith("gemini-3");
            const payloadWithThinking = JSON.parse(JSON.stringify(basePayload));
            if (supportsThinking) {
                payloadWithThinking.generationConfig = {
                    ...(payloadWithThinking.generationConfig || {}),
                    thinkingConfig: { thinkingLevel: "LOW" }
                };
            }
            for (let attempt = 0; attempt < 2; attempt++) {
                try {
                    let response = await fetchWithTimeout(
                        `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadWithThinking) },
                        40000
                    );
                    if ((response.status === 429 || response.status === 503) && attempt === 0) {
                        await new Promise(r => setTimeout(r, 1500));
                        continue;
                    }
                    let data = await response.json();
                    if (data.error && response.status === 400 && supportsThinking) {
                        response = await fetchWithTimeout(
                            `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                            { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(basePayload) },
                            40000
                        );
                        data = await response.json();
                    }
                    if (data.error) {
                        errors.push(`[${modelName}] ${data.error.message}`);
                        break;
                    }
                    if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                        const parts = data.candidates[0].content.parts || [];
                        const answerPart = parts.find(p => typeof p.text === 'string' && !p.thought) || parts.find(p => typeof p.text === 'string');
                        if (answerPart) { return { text: answerPart.text, usedModel: modelName }; }
                    }
                    break;
                } catch (err) {
                    errors.push(`[${modelName}] ${err.name === 'AbortError' ? 'タイムアウト' : err.message}`);
                    break;
                }
            }
        }
        throw new Error(errors.join(" / ") || "AIモデルでの通信に失敗しました。");
    }

    async function searchWithGemini() {
        const apiKey = document.getElementById('geminiApiKey').value.trim();
        const query = document.getElementById('aiSearchInput').value.trim();
        
        if (!apiKey) {
            alert("Gemini APIキーを入力してください。");
            return;
        }
        if (!query) {
            alert("検索したい場所やテキストを入力してください。");
            return;
        }

        localStorage.setItem('gemini_api_key_flood', apiKey);

        const btn = document.getElementById('btnAiSearch');
        btn.innerText = "⏳ 検索中...";
        btn.disabled = true;

        try {
            const prompt = `あなたは優秀な地理情報アシスタントです。以下のテキストからユーザーが見たい対象の場所を推測し、その中心座標（緯度・経度）をJSON形式で返してください。\nテキスト: "${query}"\n出力形式: {"lat": 緯度, "lon": 経度}\n※純粋なJSON文字列のみを出力してください。`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { response_mime_type: "application/json" }
            };

            const result = await callGeminiWithFallback(apiKey, payload);
            const text = result.text.replace(/```json/g, '').replace(/```/g, '').trim();
            const coords = JSON.parse(text);
            
            if (coords.lat && coords.lon) {
                map.setView([coords.lat, coords.lon], 13);
            } else {
                throw new Error("座標データが正しく取得できませんでした");
            }
            
        } catch (error) {
            console.error(error);
            alert("AIによる場所の特定に失敗しました。APIキーや入力内容を確認してください。\n詳細: " + error.message);
        } finally {
            btn.innerText = "🤖 検索";
            btn.disabled = false;
        }
    }

    function handleAiSearchEnter(event) {
        if (event.key === 'Enter') searchWithGemini();
    }

    function changePref() {
        const select = document.getElementById("prefSelect");
        const val = select.value.split(","); 
        map.setView([parseFloat(val[0]), parseFloat(val[1])], 11);
    }

    let locationMarker = null;
    function getLocation() {
        map.locate({setView: true, maxZoom: 15});
    }
    map.on('locationfound', function(e) {
        if (locationMarker) map.removeLayer(locationMarker);
        locationMarker = L.circleMarker(e.latlng, {
            radius: 8, color: '#dc3545', fillColor: '#dc3545', fillOpacity: 0.8
        }).addTo(map).bindPopup("現在地").openPopup();
    });
    map.on('locationerror', function(e) {
        alert("GPS現在地を取得できませんでした。スマホの位置情報設定をご確認ください。");
    });
</script>
